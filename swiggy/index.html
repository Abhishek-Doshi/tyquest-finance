// 100% horizontal stacked bars, one row per snapshot

    svg.append(s('line', { class: t === 0 ? 'axisline' : 'gridline', x1: x(t), x2: x(t), y1: m.t, y2: m.t + o.rows.length * rowH }));

    h('h3', { text: i.title }),
    i.detail && h('p', { text: i.detail }),
    (i.evidence.length || i.rule) && h('details', {}, h('summary', { text: 'How this is computed' }),
      i.evidence.length > 0 && h('ul', {}, i.evidence.map(e => h('li', { text: e }))),
      i.rule && h('p', { class: 'rule', text: 'Rule: ' + i.rule })));
}
function renderTakeaways() {
  const list = D.insights || [], story = D.story, sec = document.getElementById('takeaways');
  if (!list.length && !story) { fill(sec); return; }
  const n = k => list.filter(i => i.tone === k).length;
  const numbers = list.length > 0 && h('details', { class: 'numbers', open: story ? null : true },
    h('summary', {}, 'The numbers behind the story',
      h('span', { class: 'tk-summary' }, h('span', {}, h('b', { text: n('positive') }), ' strengths'), h('span', {}, h('b', { text: n('caution') }), ' to watch'), h('span', {}, h('b', { text: n('neutral') }), ' notes'))),
    h('div', { class: 'insights' }, list.map(insightCard)),
    h('p', { class: 'note tk-note', text: 'Each observation comes from a fixed rule, with its thresholds shown under "How this is computed".' }));
  fill(sec,
    h('div', { class: 'sec-head' }, h('h2', { text: 'In plain words' }),
      h('p', { class: 'note', text: 'Written automatically from the numbers on this page by fixed rules, not by a person or an AI. It describes what the data shows and is not investment advice.' })),
    story && h('div', { class: 'story' },
      story.headline && h('p', { class: 'lead', text: story.headline }),
      (story.chapters || []).map(ch => h('section', { class: 'chapter' }, h('h3', { text: ch.title }), h('p', { text: ch.text })))),
    numbers);
}

/* ---------- ownership ---------- */
const HOLD = [
  ['Promoter', 'pmPctT', ''], ['Pledged (of total shares)', 'plPctT', 'i'], ['Foreign institutions (FII)', 'fiPctT', 'b'],
  ['Domestic institutions (DII)', 'diPctT', 'b'], ['Mutual funds', 'mfPctT', 'i'], ['Insurance', 'isPctT', 'i'], ['Other DII', 'othExInsDiPctT', 'i'],
  ['Retail & others', 'rOthPctT', 'b'], ['Retail', 'rhPctT', 'i'], ['Other', 'othPctT', 'i'],
];
function renderOwnership() {
  regs.own = [];
  const sec = document.getElementById('ownership');
  const hs = (D.holdings || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!hs.length) { fill(sec, sectionHead('Ownership'), h('p', { class: 'empty', text: 'No shareholding data available' })); return; }
  const last = hs[hs.length - 1].data, prev = (hs[hs.length - 2] || {}).data || {};
  const pp = (k, f) => { const a = f(last), b = f(prev); return a != null && b != null ? { dir: a - b > .005 ? 'up' : a - b < -.005 ? 'down' : 'flat', text: `${a - b >= 0 ? '+' : MINUS}${num(Math.abs(a - b), 2)} pp QoQ` } : null; };
  const oth = d => d.diPctT != null && d.mfPctT != null ? d.diPctT - d.mfPctT : null;
  const noProm = !(last.pmPctT > 0);
  const tiles = [
    tile('Promoter', pct(last.pmPctT || 0, 2), null, noProm ? null : pp('pm', d => d.pmPctT), noProm ? 'No identified promoter' : null),
    tile('Promoter pledged', noProm ? '—' : pct(last.plPctT || 0, 2), null, noProm ? null : (last.plPctT > 0 ? { dir: 'warn', text: 'Shares pledged' } : { dir: 'up', text: 'None pledged' }), noProm ? 'No promoter holding' : null),
    tile('Foreign institutions', pct(last.fiPctT, 2), null, pp('fi', d => d.fiPctT)),
    tile('Mutual funds', pct(last.mfPctT, 2), null, pp('mf', d => d.mfPctT)),
    tile('Other DII', pct(oth(last), 2), null, pp('di', oth), 'incl. insurance'),
    tile('Retail & others', pct(last.rOthPctT, 2), null, pp('r', d => d.rOthPctT)),
    D.info.nShareholders ? tile('Shareholders', compactN(D.info.nShareholders), null, null) : null,
  ];
  const series = [
    { name: 'Promoter', color: SC(1), cssVar: '--s1', pick: d => d.pmPctT }, { name: 'Foreign institutions', color: SC(2), cssVar: '--s2', pick: d => d.fiPctT },
    { name: 'Mutual funds', color: SC(3), cssVar: '--s3', pick: d => d.mfPctT }, { name: 'Other DII', color: SC(4), cssVar: '--s4', pick: oth },
    { name: 'Retail & others', color: SC(5), cssVar: '--s5', pick: d => d.rOthPctT },
  ];
  const rowsDesc = hs.slice().reverse().map(x => ({ label: fmtMonth(x.date), values: series.map(se => se.pick(x.data)) }));
  const stackCard = (() => {
    const body = h('div', { class: 'chart-body' }); let table = false;
    const btn = h('button', { class: 'mini', type: 'button', 'aria-pressed': 'false', text: 'Table', onclick: () => { table = !table; btn.setAttribute('aria-pressed', table); btn.textContent = table ? 'Chart' : 'Table'; hideTip(); draw(); } });
    const el = h('figure', { class: 'card' },
      h('figcaption', {}, h('div', {}, h('h3', { text: 'Who owns the company' }), h('p', { class: 'sub', text: '% of shares outstanding, by quarter-end (newest first)' })), btn), legend(series), body);
    function draw() {
      body.replaceChildren();
      if (table) body.append(miniTable({ head: ['Quarter'].concat(series.map(se => se.name)), rows: rowsDesc.map(r => [r.label].concat(r.values.map(v => pct(v, 2)))) }));
      else stackRows(body, { rows: rowsDesc, series, aria: `Shareholding split over ${hs.length} quarters` });
    }
    regs.own.push(draw); return el;
  })();

  const cols = [{ label: '% of shares' }].concat(hs.map(x => ({ label: fmtMonth(x.date), n: true })), [{ label: 'Change, last qtr', n: true }]);
  const body = HOLD.map(([label, k, st]) => {
    const vals = hs.map(x => x.data[k]); if (!vals.some(v => v != null && v !== 0)) return null;
    const a = vals[vals.length - 1], b = vals[vals.length - 2];
    return { cls: st, cells: [label].concat(vals.map(v => v == null ? '—' : num(v, 2)), [a != null && b != null ? `${a - b >= 0 ? '+' : MINUS}${num(Math.abs(a - b), 2)} pp` : '—']) };
  }).filter(Boolean);

  const mf = D.mfHoldings || [], sc = D.smallcases || [];
  fill(sec, 
    sectionHead('Ownership', `Latest filing: ${fmtMonth(hs[hs.length - 1].date)}. Changes are vs the prior quarter (QoQ). Tickertape exposes the last ${hs.length} quarter-ends.`),
    h('div', { class: 'tiles', style: 'margin:0 0 12px' }, tiles),
    stackCard,
    subHead('Shareholding pattern'), dataTable(cols, body),
    mf.length ? [subHead('Top mutual fund holders', `${mf.length} largest by holding`), dataTable(
      [{ label: 'Rank', n: true }, { label: 'Scheme' }, { label: '% of company held', n: true }, { label: '3-month change', n: true }, { label: '% of fund portfolio', n: true }],
      mf.map(m => ({ cells: [m.rank == null ? '—' : (m.prevRank != null && m.prevRank !== m.rank ? `${m.rank} (was ${m.prevRank})` : String(m.rank)), m.name, pct(m.pctOfCompany, 2), m.change3m == null ? '—' : `${m.change3m >= 0 ? '+' : MINUS}${num(Math.abs(m.change3m), 2)} pp`, pct(m.pctOfFund, 2)] })))] : null,
    sc.length ? [subHead('Held by smallcases'), dataTable([{ label: 'Smallcase' }, { label: 'Publisher' }, { label: 'Theme', wrap: true }], sc.map(x => ({ cells: [x.name, x.publisher, x.description] })))] : null);
  drawGroup('own');
}
function compactN(v) { return v >= 1e7 ? num(v / 1e7, 2) + ' cr' : v >= 1e5 ? num(v / 1e5, 2) + ' lakh' : num(v, 0); }

/* ---------- dividends + corporate actions ---------- */
function renderDividends() {
  regs.div = [];
  const sec = document.getElementById('dividends');
  const dv = (D.dividends || []).slice().sort((a, b) => new Date(b.exDate) - new Date(a.exDate));
  const acts = (D.actions || []).slice().sort((a, b) => new Date(b.exDate) - new Date(a.exDate));
  const byYear = {};
  dv.forEach(d => { const y = new Date(d.exDate).getUTCFullYear(); if (d.adjusted != null) byYear[y] = (byYear[y] || 0) + d.adjusted; });
  const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
  const full = []; for (let y = years[0]; y <= years[years.length - 1]; y++) full.push(y);
  const chart = full.length ? card('div', {
    title: 'Dividend per share by year', sub: '₹ per share, summed by ex-date year; adjusted for bonus and splits', kind: 'bar',
    labels: full.map(String), series: [{ name: 'Dividend per share', color: SC(1), values: full.map(y => byYear[y] || 0) }],
    axisFmt: v => num(v, v % 1 ? 1 : 0), valFmt: v => '₹' + num(v, 2), tipFmt: v => '₹' + num(v, 2) + ' / share', aria: `Dividend per share by year, ${full[0]} to ${full[full.length - 1]}`,
    table: () => ({ head: ['Year', '₹ per share'], rows: full.map(y => [String(y), num(byYear[y] || 0, 2)]) }),
  }) : null;
  const up = D.upcomingDividends || [];
  fill(sec, 
    sectionHead('Dividends & corporate actions', `${dv.length} cash dividend${dv.length === 1 ? '' : 's'} and ${acts.length} corporate action${acts.length === 1 ? '' : 's'} on record`),
    up.length ? h('p', { class: 'note', style: 'margin-bottom:10px', text: 'Upcoming: ' + up.map(u => `${fmtDate(u.exDate)} (${u.kind || 'dividend'}, ₹${u.declared})`).join('; ') }) : null,
    h('div', { class: 'cols2', style: 'margin-top:0' }, chart,
      dv.length ? dataTable([{ label: 'Ex-date' }, { label: 'Type' }, { label: 'Declared ₹', n: true }, { label: 'Adjusted ₹', n: true }],
        dv.map(d => ({ cells: [fmtDate(d.exDate), d.kind, d.declared == null ? '—' : num(parseFloat(d.declared), 2), d.adjusted == null ? '—' : num(d.adjusted, 2)] })), { scroll: true }) : h('p', { class: 'empty', text: 'No cash dividends on record' })),
    subHead('Corporate actions', 'bonus, splits, buybacks, rights and similar'),
    acts.length ? dataTable([{ label: 'Ex-date' }, { label: 'Action' }, { label: 'Detail', wrap: true }, { label: 'Ratio', n: true }, { label: 'Price adj. factor', n: true }],
      acts.map(a => ({ cells: [fmtDate(a.exDate), a.type, a.detail, a.ratio, a.adjustmentFactor == null ? '—' : num(a.adjustmentFactor, 4)] }))) : h('p', { class: 'empty', text: 'No corporate actions on record' }));
  drawGroup('div');
}

/* ---------- filings ---------- */
function renderFilings() {
  const sec = document.getElementById('filings');
  const reports = (D.annualReports || []).slice().sort((a, b) => b.year - a.year);
  const count = {}; reports.forEach(r => { count[r.year] = (count[r.year] || 0) + 1; });
  const seen = {};
  const chips = reports.map(r => { seen[r.year] = (seen[r.year] || 0) + 1; return link(r.link, count[r.year] > 1 ? `${r.year} (${seen[r.year]})` : String(r.year)); })
    .filter(Boolean).map(a => { a.className = 'linkchip'; return a; });
  const pres = (D.presentations || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const ann = (D.announcements || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const subjects = Array.from(new Set(ann.map(a => a.subject).filter(Boolean))).sort();
  const legal = (D.legal || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));

  const annHost = h('div'), q = { text: '', subject: '', all: false };
  function drawAnn() {
    const t = q.text.toLowerCase();
    const list = ann.filter(a => (!q.subject || a.subject === q.subject) && (!t || ((a.detail || '') + ' ' + (a.subject || '')).toLowerCase().includes(t)));
    const shown = q.all ? list : list.slice(0, 15);
    fill(annHost,
      list.length ? dataTable([{ label: 'Date' }, { label: 'Subject' }, { label: 'Detail', wrap: true }, { label: 'Document' }],
        shown.map(a => ({ cells: [fmtDate(a.date), a.subject, a.detail, link(a.link, 'Open') ? { node: link(a.link, 'Open') } : '—'] })), { scroll: q.all }) : h('p', { class: 'empty', text: 'No announcements match' }),
      list.length > shown.length ? h('button', { class: 'mini more', type: 'button', text: `Show all ${list.length}`, onclick: () => { q.all = true; drawAnn(); } }) : null);
  }
  fill(sec, 
    sectionHead('Filings'),
    subHead('Annual reports', `${reports.length} on record`),
    chips.length ? h('div', { class: 'chips-row' }, chips) : h('p', { class: 'empty', text: 'No annual reports listed' }),
    subHead('Investor presentations', pres.length ? `${pres.length} on record; Tickertape serves the PDFs through short-lived links, so only the listing is kept here` : null),
    pres.length ? dataTable([{ label: 'Date' }, { label: 'Detail', wrap: true }], pres.map(p => ({ cells: [fmtDate(p.date), p.detail] }))) : h('p', { class: 'empty', text: 'No investor presentations listed' }),
    subHead('Recent exchange announcements', `${ann.length} in the most recent window`),
    ann.length ? h('div', { class: 'filters' },
      h('input', { type: 'search', placeholder: 'Search announcements', 'aria-label': 'Search announcements', oninput: e => { q.text = e.target.value; drawAnn(); } }),
      h('select', { 'aria-label': 'Filter by subject', onchange: e => { q.subject = e.target.value; drawAnn(); } },
        h('option', { value: '', text: 'All subjects' }), subjects.map(sj => h('option', { value: sj, text: sj })))) : null,
    ann.length ? annHost : h('p', { class: 'empty', text: 'No announcements available' }),
    legal.length ? [subHead('Legal orders', `${legal.length} on record`), dataTable([{ label: 'Order date' }, { label: 'Case no.' }, { label: 'Detail', wrap: true }, { label: 'Source' }, { label: 'Document' }],
      legal.map(l => ({ cells: [fmtDate(l.date), l.caseNo, l.detail, l.source, link(l.link, 'Open') ? { node: link(l.link, 'Open') } : '—'] })), { scroll: legal.length > 10 })] : null);
  if (ann.length) drawAnn();
}

/* ---------- footer + boot ---------- */
function renderFooter() {
  fill(document.getElementById('foot'), 
    h('p', { text: `Source: Tickertape public endpoints (unofficial, may change or disappear). Generated ${fmtDate(D.generated)}. Slow-changing data only: statements, ownership, dividends and corporate actions, filings. No prices.` }),
    h('p', { text: 'Figures are as published by Tickertape and have not been independently verified.' }),
    (D.errors || []).length ? h('p', { class: 'err', text: 'Some sections could not be loaded when this report was built: ' + D.errors.join('; ') }) : null,
    (D.insightErrors || []).length ? h('p', { class: 'err', text: 'Some observation rules failed: ' + D.insightErrors.join('; ') }) : null);
}

try {
  renderOverview(); renderTakeaways(); renderFinancials(); renderOwnership(); renderDividends(); renderFilings(); renderFooter();
} catch (e) {
  document.body.prepend(h('pre', { id: 'js-errors', class: 'err', text: 'Render error: ' + (e && e.stack || e) }));
}
addEventListener('error', e => document.body.prepend(h('pre', { id: 'js-errors', class: 'err', text: 'Error: ' + e.message })));
})();
</script>
</body>
</html>
