<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found</title><style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--border:rgba(255,255,255,.10);--accent:#3987e5}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:980px;margin:0 auto;padding:48px 16px 64px}
h1{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.lede{color:var(--ink2);max-width:62ch;margin:0 0 28px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.co{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;color:inherit}
.co:hover{text-decoration:none;border-color:var(--accent)}
.co h2{font-size:17px;margin:0 0 2px}.co .meta{color:var(--ink2);font-size:12.5px;margin-bottom:8px}
.co p{margin:0;color:var(--ink2);font-size:14px}.co .upd{margin-top:10px;font-size:12px;color:var(--muted)}
footer{margin-top:40px;color:var(--ink2);font-size:12.5px;max-width:70ch}
</style></head><body><div class="wrap"><h1>Page not found</h1><p class="lede">There is no report at this address.</p><p><a href="/">See all companies</a></p></div></body></html>
