/* ---------- scales + marks ---------- */

const f1 = v => Math.round(v * 100) / 100;
// vertical bar: baseline-side square, data end rounded
function vBar(x, w, yBase, yEnd, r) {

}
const rectPath = (x, y0, w, y1) => `M${f1(x)},${f1(y0)}V${f1(y1)}H${f1(x + w)}V${f1(y0)}Z`;

  return `M${f1(x0)},${f1(y)}H${f1(x1 - r)}Q${f1(x1)},${f1(y)} ${f1(x1)},${f1(y + r)}V${f1(y + hgt - r)}Q${f1(x1)},${f1(y + hgt)} ${f1(x1 - r)},${f1(y + hgt)}H${f1(x0)}Z`;
}

      const txt = (o.valFmt || compact)(v), tw = txt.length * 6.6, ly = v >= 0 ? y(v) - 6 : y(v) + 14;

function lineChart(host, o) {

// 100% horizontal stacked bars, one row per snapshot
function stackRows(host, o) {

    svg.append(s('line', { class: t === 0 ? 'axisline' : 'gridline', x1: x(t), x2: x(t), y1: m.t, y2: m.t + o.rows.length * rowH }));
    svg.append(s('text', { x: x(t), y: H - 8, 'text-anchor': t === 0 ? 'start' : t === 100 ? 'end' : 'middle', text: t + '%' }));

    const segs = o.series.map((se, j) => ({ se, v: row.values[j] || 0 })).filter(q => q.v > 0.0001);

function tidyPeriod(p) {
  const last = String(p || '').split(' - ').pop().trim();           // "JUN '26 - SEP '26" -> "SEP '26"
  let m = /^([A-Z]{3}) '?(\d{2})(\d{2})?$/.exec(last);              // SEP '26 / JUN 2020
  if (m) return m[1][0] + m[1].slice(1).toLowerCase() + ' ' + (m[3] || m[2]);
  m = /^FY '?(\d{2})(\d{2})?$/.exec(last);                          // FY '26 / FY 2026
  if (m) return 'FY' + (m[2] || m[1]);
  return last || '—';
}
function colLabel(r) {
  if (r.displayPeriod === 'TTM') return 'TTM';
  const d = r.endDate ? new Date(r.endDate) : null;
  if (!d || isNaN(d)) return tidyPeriod(r.displayPeriod);
  return isAnnual() ? 'FY' + String(d.getUTCFullYear()).slice(2)
    : `${MONTHS[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`;
}
function fmtCell(unit, v, view, code) {
  if (v == null) return '—';
  if (view === 'growth') return spct(v);
  if (view === 'margin') return /Eps$/.test(code) ? num(v, 2) : pct(v);
  if (unit === 'rs') return num(v, 2);
  if (unit === 'ratio') return pct(v * 100);
  if (unit === 'shares') return num(v, 2);
  return num(v, 0);
}
function finTable(rows) {
  const cols = [{ label: '₹ crore' }].concat(rows.map(r => ({ label: colLabel(r), n: true })));
  const body = [];
  LINES[fin.stmt].forEach(([code, label, unit, st]) => {
    if (st === 'g') { body.push({ cls: 'grp', cells: [label].concat(rows.map(() => '')) }); return; }
    const c = codeOf(code), vals = rows.map(r => r[c]);
    if (!vals.some(v => v != null && v !== 0)) return;
    body.push({ cls: st, cells: [label].concat(vals.map((v, i) => ({ t: fmtCell(unit, v, fin.view, c), cls: rows[i].displayPeriod === 'TTM' ? 'ttm' : '' }))) });
  });
  // drop group headers that ended up with nothing under them
  const kept = body.filter((r, i) => r.cls !== 'grp' || (body[i + 1] && body[i + 1].cls !== 'grp'));
  return dataTable(cols, kept);
}

/* ---------- overview ---------- */
function tile(label, value, unit, delta, note) {
  return h('div', { class: 'tile' },
    h('div', { class: 'l', text: label }),
    h('div', { class: 'v' }, value, unit && h('small', { text: unit })),
    (delta || note) && h('div', { class: 'd' }, delta ? h('span', { class: 'dg' }, h('span', { class: 'ico ' + delta.dir, 'aria-hidden': 'true', text: delta.dir === 'up' ? '▲' : delta.dir === 'down' ? '▼' : delta.dir === 'warn' ? '◆' : '▬' }), ' ', delta.text) : null, note && h('span', { text: note })));
}
function change(cur, prev, label) {
  if (cur == null || prev == null || prev <= 0) return null;
  const p = (cur / prev - 1) * 100;
  return { dir: p > 0.05 ? 'up' : p < -0.05 ? 'down' : 'flat', text: `${spct(p)} vs ${label}` };
}
function renderOverview() {
  const i = D.info, sec = document.getElementById('overview');
  document.getElementById('brand').textContent = i.name || i.sid;
  const chip = (k, v) => v ? h('span', { class: 'chip' }, k ? k + ' ' : '', h('b', { text: v })) : null;
  const gic = i.gic ? [i.gic.sector, i.gic.industry, i.gic.subindustry].filter((x, j, a) => x && a.indexOf(x) === j).join(' › ') : null;
  const ann = rowsFor('income', 'annual', 'normal').filter(r => r.displayPeriod !== 'TTM');
  const cf = rowsFor('cashflow', 'annual', 'normal');
  const cur = ann[ann.length - 1] || {}, prev = ann[ann.length - 2] || {};
  const fy = ann.length ? colLabelFor(cur) : '';
  const cfCur = cf[cf.length - 1] || {}, cfPrev = cf[cf.length - 2] || {};
  const margin = r => (r.incNinc != null && r.incTrev > 0) ? r.incNinc / r.incTrev * 100 : null;
  const mc = margin(cur), mp = margin(prev);
  const tiles = [];
  if (ann.length) {
    tiles.push(
      tile(`Revenue · ${fy}`, num(cur.incTrev, 0), '₹ cr', change(cur.incTrev, prev.incTrev, colLabelFor(prev))),
      tile(`Net income · ${fy}`, num(cur.incNinc, 0), '₹ cr', change(cur.incNinc, prev.incNinc, colLabelFor(prev))),
      tile(`EPS · ${fy}`, num(cur.incEps, 2), '₹', change(cur.incEps, prev.incEps, colLabelFor(prev))),
      tile(`Net margin · ${fy}`, pct(mc), null, mc != null && mp != null ? { dir: mc - mp > .05 ? 'up' : mc - mp < -.05 ? 'down' : 'flat', text: `${mc - mp >= 0 ? '+' : MINUS}${num(Math.abs(mc - mp), 1)} pp vs ${colLabelFor(prev)}` } : null),
      tile(`Operating cash flow · ${fy}`, num(cfCur.cafCfoa, 0), '₹ cr', change(cfCur.cafCfoa, cfPrev.cafCfoa, colLabelFor(prev))),
      tile(`Dividend per share · ${fy}`, cur.incDps == null ? '—' : num(cur.incDps, 2), cur.incDps == null ? null : '₹', change(cur.incDps, prev.incDps, colLabelFor(prev))));
  }
  fill(sec, 
    h('h1', { text: i.name || i.sid }),
    h('div', { class: 'chips' },
      chip('', [i.ticker, i.exchange].filter(Boolean).join(' · ')), chip('ISIN', i.isin), chip('', i.sector), chip('GICS', gic),
      chip('', i.marketCapLabel), (i.tags || []).filter(t => t !== i.sector).map(t => chip('', t))),
    i.description && h('p', { class: 'about', text: i.description }),
    tiles.length > 0 && h('div', { class: 'tiles' }, tiles));
}
function colLabelFor(r) { const d = r.endDate ? new Date(r.endDate) : null; return d && !isNaN(d) ? 'FY' + String(d.getUTCFullYear()).slice(2) : (r.displayPeriod || ''); }

    subHead('Annual reports', `${reports.length} on record`),
    chips.length ? h('div', { class: 'chips-row' }, chips) : h('p', { class: 'empty', text: 'No annual reports listed' }),
    subHead('Investor presentations', pres.length ? `${pres.length} on record; Tickertape serves the PDFs through short-lived links, so only the listing is kept here` : null),
    pres.length ? dataTable([{ label: 'Date' }, { label: 'Detail', wrap: true }], pres.map(p => ({ cells: [fmtDate(p.date), p.detail] }))) : h('p', { class: 'empty', text: 'No investor presentations listed' }),
    subHead('Recent exchange announcements', `${ann.length} in the most recent window`),
    ann.length ? h('div', { class: 'filters' },
      h('input', { type: 'search', placeholder: 'Search announcements', 'aria-label': 'Search announcements', oninput: e => { q.text = e.target.value; drawAnn(); } }),
      h('select', { 'aria-label': 'Filter by subject', onchange: e => { q.subject = e.target.value; drawAnn(); } },
        h('option', { value: '', text: 'All subjects' }), subjects.map(sj => h('option', { value: sj, text: sj })))) : null,
    ann.length ? annHost : h('p', { class: 'empty', text: 'No announcements available' }),
    legal.length ? [subHead('Legal orders', `${legal.length} on record`), dataTable([{ label: 'Order date' }, { label: 'Case no.' }, { label: 'Detail', wrap: true }, { label: 'Source' }, { label: 'Document' }],
      legal.map(l => ({ cells: [fmtDate(l.date), l.caseNo, l.detail, l.source, link(l.link, 'Open') ? { node: link(l.link, 'Open') } : '—'] })), { scroll: legal.length > 10 })] : null);
  if (ann.length) drawAnn();
}

/* ---------- footer + boot ---------- */
function renderFooter() {
  fill(document.getElementById('foot'), 
    h('p', { text: `Source: Tickertape public endpoints (unofficial, may change or disappear). Generated ${fmtDate(D.generated)}. Slow-changing data only: statements, ownership, dividends and corporate actions, filings. No prices.` }),
    h('p', { text: 'Figures are as published by Tickertape and have not been independently verified.' }),
    (D.errors || []).length ? h('p', { class: 'err', text: 'Some sections could not be loaded when this report was built: ' + D.errors.join('; ') }) : null,
    (D.insightErrors || []).length ? h('p', { class: 'err', text: 'Some observation rules failed: ' + D.insightErrors.join('; ') }) : null);
}

try {
  renderOverview(); renderTakeaways(); renderFinancials(); renderOwnership(); renderDividends(); renderFilings(); renderFooter();
} catch (e) {
  document.body.prepend(h('pre', { id: 'js-errors', class: 'err', text: 'Render error: ' + (e && e.stack || e) }));
}
addEventListener('error', e => document.body.prepend(h('pre', { id: 'js-errors', class: 'err', text: 'Error: ' + e.message })));
})();
</script>
</body>
</html>
